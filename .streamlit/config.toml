[theme]
font = "sans serif"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#141B2F"
